<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlatMMO Companion App</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; margin: 0; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #2d2d2d; }
        h1, h3 { color: #4fc3f7; margin-top: 0; }
        select, input, button { background: #2d2d2d; color: #fff; border: 1px solid #3d3d3d; padding: 12px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 14px; }
        button { background: #0288d1; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #01579b; }
        .output-box { background: #151515; padding: 12px; border-radius: 4px; border-left: 4px solid #4fc3f7; font-family: monospace; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 30px;">🛡️ FlatMMO Cloud Companion</h1>

    <div class="grid-layout">
        
        <!-- LOOKUP MODULE -->
        <div class="card">
            <h3>📖 Database Lookup</h3>
            <label for="monsterSelect">Select Target Profile:</label>
            <select id="monsterSelect" onchange="showMonsterData()">
                <option value="">-- No Data Loaded --</option>
            </select>
            <div id="lookupPanel" class="output-box">Data will load automatically when you select a monster from the list.</div>
        </div>

        <!-- REUSABLE XP CALCULATOR -->
        <div class="card">
            <h3>🧮 XP per Hour Calculator</h3>
            <label for="xpPerAction">XP Earned Per Action:</label>
            <input type="number" id="xpPerAction" value="15" min="1">
            
            <label for="actionsPerMinute">Actions Per Minute:</label>
            <input type="number" id="actionsPerMinute" value="8" min="1">
            
            <button onclick="calculateXpVelocity()">Calculate Progression Curves</button>
            <div id="calcPanel" class="output-box">Enter your metrics above to calculate training milestones.</div>
        </div>

    </div>

    <!-- LINK THE DATABASE FILE -->
    <script src="database.js"></script>
    <script>
        window.appDatabase = {};

        window.onload = function() {
            const dropdown = document.getElementById('monsterSelect');
            
            if (window.rawMonsterLogs) {
                dropdown.innerHTML = '<option value="">-- Select Target --</option>';
                
                Object.keys(window.rawMonsterLogs).forEach(key => {
                    let logData = window.rawMonsterLogs[key];
                    let logArray = [];
                    
                    // Step 1: Convert raw string blocks safely into array rows
                    if (typeof logData === 'string') {
                        try {
                            let parsed = JSON.parse(logData.trim());
                            logArray = parsed.entries ? parsed.entries : parsed;
                        } catch(e) {
                            // Split line by line if JSON string handles basic text breaks
                            logArray = logData.split('\n');
                        }
                    } else if (typeof logData === 'object' && logData !== null) {
                        logArray = logData.entries ? logData.entries : logData;
                    }

                    if (!Array.isArray(logArray) || logArray.length === 0) return;

                    // Step 2: Set the default name from the database key link
                    let name = key;
                    
                    let hp = "Unknown HP";
                    let combatStats = [];
                    let dropItems = [];

                    logArray.forEach(line => {
                        let clean = line.toString().trim()
                                        .replace(/^"/, '')     
                                        .replace(/"\s*,?$/, '') 
                                        .replace(/\\"/g, '"')   
                                        .trim();

                        if (clean.startsWith("HP:")) {
                            hp = clean;
                        } else if (clean.startsWith("Accuracy:") || clean.startsWith("Max Hit:") || clean.startsWith("Defence:") || clean.startsWith("Magic Defence:") || clean.startsWith("Weakness:")) {
                            combatStats.push(clean);
                        } else {
                            // 🌟 THE UNIVERSAL PARSER FIX: Detect literal tab escapes, double slashes, or large white spacing blocks smoothly
                            let isLootRow = clean.includes("\t") || clean.includes("\\t") || clean.includes("   ");
                            
                            if (isLootRow && !clean.includes("Chance") && !clean.includes("Name") && !clean.includes("POSSIBLE")) {
                                // Standardise the split using a clean regex pattern for tab characters or multiple space groups
                                let pieces = clean.split(/\\t+|\t+|\s{3,}/);
                                if (pieces.length >= 3) {
                                    dropItems.push(`${pieces[0].trim()} (Qty: ${pieces[1].trim()}, Rate: ${pieces[2].trim()})`);
                                }
                            }
                        }
                    });

                    // Step 3: Secure into memory workspace structures
                    window.appDatabase[key] = {
                        name: name.charAt(0).toUpperCase() + name.slice(1),
                        stats: `${hp} | ${combatStats.join(" | ")}`,
                        drops: dropItems.length > 0 ? dropItems.join("<br> ↳ ") : "No drops recorded."
                    };

                    let option = document.createElement('option');
                    option.value = key;
                    option.innerText = window.appDatabase[key].name;
                    dropdown.appendChild(option);
                });
            } else {
                document.getElementById('lookupPanel').innerText = "Awaiting database entries. database.js is currently empty.";
            }
        };

        function showMonsterData() {
            const key = document.getElementById('monsterSelect').value;
            const panel = document.getElementById('lookupPanel');

            if (key && window.appDatabase[key]) {
                const target = window.appDatabase[key];
                panel.innerHTML = `<strong>Name:</strong> ${target.name}<br><br>` +
                                  `<strong>Combat Profile:</strong><br>${target.stats}<br><br>` +
                                  `<strong>Drop List:</strong><br> ↳ ${target.drops}`;
            } else {
                panel.innerText = "Select a monster from the list to see data entries.";
            }
        }

        function calculateXpVelocity() {
            const xp = parseFloat(document.getElementById('xpPerAction').value) || 0;
            const rate = parseFloat(document.getElementById('actionsPerMinute').value) || 0;
            const hourlyXp = xp * rate * 60;
            
            document.getElementById('calcPanel').innerHTML = 
                `<strong>Hourly Training Rate:</strong> ${hourlyXp.toLocaleString()} XP / Hour<br>` +
                `<strong>Projected 8-Hour Work Shift:</strong> ${(hourlyXp * 8).toLocaleString()} XP gained.`;
        }
    </script>
</body>
</html>
